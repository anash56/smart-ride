services:
  postgres:
    image: postgres:17
    container_name: smart-ride-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smart_ride
      POSTGRES_PASSWORD: smart_ride_password
      POSTGRES_DB: smart_ride
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: